<svg xmlns="http://www.w3.org/2000/svg" id="cosine-plot" class="plot" viewBox="0 0 540 410" role="img" aria-labelledby="cos-title cos-desc"><style>text{font-family:Arial,Apple SD Gothic Neo,sans-serif}.axis{font-size:12px;fill:#536271}.label{font-size:13px;fill:#172332}</style><rect x="0" y="0" width="540" height="410" fill="#f7fafb"/><title id="cos-title">문서와 두 라벨의 2차원 벡터</title><desc id="cos-desc">문서는 청색 실선, 긍정 라벨은 녹색 점선, 부정 라벨은 황갈색 점선입니다. 좌표는 실제 모델 임베딩이 아닙니다.</desc><line x1="60" y1="20" x2="82" y2="20" stroke="#175e73" stroke-width="3"></line><text x="88" y="25" class="label">문서</text><circle cx="174" cy="20" r="5" fill="#367660"></circle><text x="186" y="25" class="label">긍정</text><rect x="267" y="15" width="10" height="10" fill="#b47026"></rect><text x="285" y="25" class="label">부정</text><line x1="82" y1="212" x2="460" y2="212" stroke="#bdcbd3"></line><line x1="270" y1="30" x2="270" y2="394" stroke="#bdcbd3"></line><text x="116" y="230" text-anchor="middle" class="axis">-2</text><text x="258" y="370" text-anchor="end" class="axis">-2</text><text x="193" y="230" text-anchor="middle" class="axis">-1</text><text x="258" y="293" text-anchor="end" class="axis">-1</text><text x="347" y="230" text-anchor="middle" class="axis">1</text><text x="258" y="139" text-anchor="end" class="axis">1</text><text x="424" y="230" text-anchor="middle" class="axis">2</text><text x="258" y="62" text-anchor="end" class="axis">2</text><circle cx="270" cy="212" r="77" fill="none" stroke="#d7e0e5" stroke-dasharray="3 4"></circle><text x="468" y="217" class="axis">x₁</text><text x="280" y="48" class="axis">x₂</text><line x1="270" y1="212" x2="347" y2="212" stroke="#367660" stroke-width="3" stroke-dasharray="7 5"></line><circle cx="347" cy="212" r="5" fill="#367660"></circle><line x1="270" y1="212" x2="270" y2="135" stroke="#b47026" stroke-width="3" stroke-dasharray="7 5"></line><rect x="265" y="130" width="10" height="10" fill="#b47026"></rect><line x1="270" y1="212" x2="331.49493427364155"